name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Bump manifest and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: true

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json version
        run: |
          MANIFEST="custom_components/izone_zm_v2/manifest.json"
          python3 -c "
          import json
          path = '$MANIFEST'
          with open(path) as f:
              data = json.load(f)
          data['version'] = '${{ steps.version.outputs.version }}'
          # hassfest requires: domain, name, then remaining keys alphabetical
          ordered = {}
          for key in ('domain', 'name'):
              if key in data:
                  ordered[key] = data.pop(key)
          for key in sorted(data):
              ordered[key] = data[key]
          with open(path, 'w') as f:
              json.dump(ordered, f, indent=2)
              f.write('\n')
          "

      - name: Commit manifest bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/izone_zm_v2/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit (manifest already at this version)."
          else
            git commit -m "Bump manifest version to ${{ steps.version.outputs.version }} [skip ci]"
            git push origin main
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true